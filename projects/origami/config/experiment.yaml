experiment:
  id: airplane_02
  name: Learn to fold a paper airplane
  version: 2
  introduction: Use rectangular Letter paper. Photograph the whole sheet on a contrasting surface before each action. Keep the nose pointing away from you. Allow 5–10 minutes.
steps:
  - action_id: crease_center
    image: airplane-step-02.jpg
    title: Make the centre crease
    instruction: Fold the sheet in half lengthwise, align the long edges, crease, then unfold. Keep the crease vertical.
  - action_id: fold_top_corners
    image: airplane-step-03.jpg
    title: Fold the top corners
    instruction: Fold both top corners until their edges meet the centre crease. The top becomes a triangle.
  - action_id: fold_triangle_down
    image: airplane-step-04.jpg
    title: Fold the triangle down
    instruction: Fold the top triangle down. The sheet should look like an envelope.
  - action_id: fold_corners_again
    image: airplane-step-05.jpg
    title: Fold the corners again
    instruction: Fold both top corners inward again until they meet the centre crease.
  - action_id: fold_tip_up
    image: airplane-step-06.jpg
    title: Fold the tip up
    instruction: Fold the small triangle at the bottom up over the folds to hold them in place.
  - action_id: close_airplane
    image: airplane-step-07.jpg
    title: Close the airplane
    instruction: Fold the airplane in half, opposite the original crease. Keep the small tip on the outside underneath.
  - action_id: fold_wings
    image: airplane-step-08.jpg
    title: Fold the wings
    instruction: Lay the airplane on its side and fold the top flap down until it lines up with the base. Turn it over and repeat. Crease firmly.
